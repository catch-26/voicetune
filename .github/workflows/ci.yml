name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r tests/requirements.txt
      - name: bash syntax
        run: for f in run.sh stt/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning -f gcc run.sh stt/*.sh
      - name: ruff
        run: ruff check --output-format github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -v tests

  resolve:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: stt/requirements-whisper.txt
            python: "3.13"
          - file: stt/requirements-parakeet.txt
            python: "3.12"
          - file: tts/requirements.txt
            python: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: pinned requirements resolve together
        run: f="${{ matrix.file }}"; uv pip compile "$f" -c "${f%.txt}.lock" --python-version "${{ matrix.python }}" --python-platform x86_64-manylinux_2_28 --torch-backend cpu -o /dev/null

  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pinned archives and files match their hashes
        run: python3 tools/update_pins.py --verify

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release id matches VERSION when a release section is pending
        run: |
          v=$(cat VERSION)
          if grep -q "^# $v (" CHANGELOG.md && [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
            python3 tools/version.py --check
          else
            echo "no pending release for $v"
          fi
