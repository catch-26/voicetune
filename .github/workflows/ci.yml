name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r tests/requirements.txt
      - name: bash syntax
        run: for f in *.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning -f gcc *.sh
      - name: ruff
        run: ruff check --output-format github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r tests/requirements.txt
      - run: python -m pytest -v tests

  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: release id matches VERSION when a release section is pending
        run: |
          v=$(cat VERSION)
          if grep -q "^# $v (" CHANGELOG.md && [ -z "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
            python3 tools/version.py --check
          else
            echo "no pending release for $v"
          fi
