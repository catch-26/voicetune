version: 2
updates:
  - package-ecosystem: pip
    directories: ["/stt", "/tests", "/lib"]
    schedule:
      interval: daily
      time: "03:00"
      timezone: Europe/Vienna
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /tts
    schedule:
      interval: daily
      time: "03:00"
      timezone: Europe/Vienna
    ignore:
      - dependency-name: transformers
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Europe/Vienna
    groups:
      actions:
        patterns: ["*"]
